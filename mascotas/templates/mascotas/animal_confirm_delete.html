{% extends 'mascotas/base.html' %}

{% block title %}Confirmar Borrado{% endblock %}

{% block content %}
    <h1>Confirmar Borrado</h1>
    <p>¿Estás seguro de que quieres borrar al animal "<strong>{{ animal.nombre }} ({{ animal.especie }})</strong>"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, borrar</button>
        <a href="{% url 'animal_detail' animal.pk %}" class="btn btn-secondary">Cancelar</a>
    </form>
{% endblock %}
